services:
  team-manager:
    image: sherif172/team-manager

    ports:
      - target: 8080
        published: 80

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    env_file:
      - .env
    depends_on:
      - Cache-Service

    networks:
      - CachingNetwork

  Cache-Service:
    image: redis:7-alpine

    restart: unless-stopped

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - CachingNetwork

volumes:
  redis-data:

networks:
  CachingNetwork:
    driver: bridge
    attachable: true
